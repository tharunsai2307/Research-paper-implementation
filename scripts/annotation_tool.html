<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coconut Disease Human Polygon Annotation Tool — Phase 11</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #38bdf8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #065f46;
      color: #6ee7b7;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 340px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow-y: auto;
    }
    .canvas-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #020617;
      padding: 10px;
      overflow: hidden;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select, input, button {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    select:focus, input:focus {
      border-color: var(--accent);
    }
    button {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button.primary {
      background: var(--accent);
      color: #022c22;
      border: none;
    }
    button.primary:hover {
      background: #059669;
    }
    button.secondary {
      background: #334155;
      color: var(--text-main);
    }
    button.danger {
      background: var(--danger);
      color: #fff;
      border: none;
    }
    .nav-buttons {
      display: flex;
      gap: 8px;
    }
    .nav-buttons button {
      flex: 1;
    }
    .alert-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.3;
    }
    .info-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      line-height: 1.4;
    }
    canvas {
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: crosshair;
    }
    .toolbar {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .toolbar button {
      padding: 4px 10px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span>🌴 Human Polygon Annotation Tool</span>
      <span class="badge">Phase 11 Double-Annotator QC</span>
    </h1>
    <div style="font-size: 0.8rem; color: var(--text-muted);">
      Target QC Threshold: IoU ≥ 0.75 (Phytopathology Specification)
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <div class="alert-box">
        ⚠️ <strong>Strict Rule</strong>: Never auto-fill bounding boxes. Tracing must strictly follow the necrotic lesion margin.
      </div>

      <div class="control-group">
        <label>Image Navigation</label>
        <div class="nav-buttons">
          <button id="btnPrev" class="secondary">◀ Previous</button>
          <button id="btnNext" class="secondary">Next ▶</button>
        </div>
        <select id="imageSelect" style="margin-top: 4px;"></select>
      </div>

      <div class="control-group">
        <label>Annotator Role & Cohort</label>
        <select id="annotatorRole">
          <option value="annotator_A">Annotator A (Primary Annotation)</option>
          <option value="annotator_B">Annotator B (Independent Double QC)</option>
          <option value="reviewer">Reviewer (Consensus Adjudication)</option>
        </select>
        <input type="text" id="annotatorId" value="AGRONOMIST_A_01" placeholder="Annotator ID">
      </div>

      <div class="control-group">
        <label>Disease Category</label>
        <select id="classSelect">
          <option value="0">0: bud root dropping</option>
          <option value="1">1: bud rot</option>
          <option value="2">2: gray leaf spot</option>
          <option value="3">3: leaf rot</option>
          <option value="4">4: stembleeding</option>
        </select>
      </div>

      <div class="control-group">
        <label>Actions</label>
        <button id="btnCompletePoly" class="primary">Close & Complete Polygon</button>
        <button id="btnUndo">Undo Last Vertex</button>
        <button id="btnClear" class="danger">Clear Polygon</button>
      </div>

      <div class="info-box" id="polyInfo">
        Vertices: 0<br>
        Normalized Area: 0.0000<br>
        Status: Ready to delineate
      </div>

      <button id="btnExport" class="primary" style="margin-top: auto;">Export YOLO Segmentation Polygon</button>
    </div>

    <div class="canvas-container" id="container">
      <canvas id="annotationCanvas" width="700" height="700"></canvas>
      <div class="toolbar">
        <button id="btnZoomIn">Zoom In (+)</button>
        <button id="btnZoomOut">Zoom Out (-)</button>
        <button id="btnResetView">Reset View</button>
        <span id="zoomLevel" style="font-family: monospace; font-size: 0.8rem; align-self: center;">100%</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('annotationCanvas');
    const ctx = canvas.getContext('2d');
    let points = [];
    let isClosed = false;
    let zoom = 1.0;
    let panX = 0, panY = 0;

    // Populate image list (100 benchmark images)
    const prefixes = [
      { name: "BudRootDropping", count: 20, cls: 0 },
      { name: "BudRot", count: 20, cls: 1 },
      { name: "GrayLeafSpot", count: 20, cls: 2 },
      { name: "LeafRot", count: 20, cls: 3 },
      { name: "StemBleeding", count: 20, cls: 4 }
    ];
    const imageList = [];
    const select = document.getElementById('imageSelect');
    prefixes.forEach(p => {
      for (let i = 1; i <= p.count; i++) {
        const id = `${p.name}${String(i).padStart(3, '0')}.jpg`;
        imageList.push({ id, cls: p.cls });
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = id;
        select.appendChild(opt);
      }
    });

    let currentIdx = 0;
    function selectImage(idx) {
      currentIdx = Math.max(0, Math.min(imageList.length - 1, idx));
      select.value = imageList[currentIdx].id;
      document.getElementById('classSelect').value = imageList[currentIdx].cls;
      points = [];
      isClosed = false;
      draw();
      updateInfo();
    }

    document.getElementById('btnPrev').addEventListener('click', () => selectImage(currentIdx - 1));
    document.getElementById('btnNext').addEventListener('click', () => selectImage(currentIdx + 1));
    select.addEventListener('change', (e) => {
      const idx = imageList.findIndex(item => item.id === e.target.value);
      if (idx !== -1) selectImage(idx);
    });

    canvas.addEventListener('click', (e) => {
      if (isClosed) return;
      const rect = canvas.getBoundingClientRect();
      const rawX = (e.clientX - rect.left);
      const rawY = (e.clientY - rect.top);
      
      const normX = Math.max(0, Math.min(1, rawX / canvas.width));
      const normY = Math.max(0, Math.min(1, rawY / canvas.height));
      points.push([normX, normY]);
      draw();
      updateInfo();
    });

    document.getElementById('btnUndo').addEventListener('click', () => {
      points.pop();
      isClosed = false;
      draw();
      updateInfo();
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      points = [];
      isClosed = false;
      draw();
      updateInfo();
    });

    document.getElementById('btnCompletePoly').addEventListener('click', () => {
      if (points.length >= 3) {
        isClosed = true;
        draw();
        updateInfo();
      } else {
        alert("At least 3 vertices required to close a polygon.");
      }
    });

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      zoom = Math.min(3.0, zoom + 0.25);
      updateZoom();
    });
    document.getElementById('btnZoomOut').addEventListener('click', () => {
      zoom = Math.max(0.5, zoom - 0.25);
      updateZoom();
    });
    document.getElementById('btnResetView').addEventListener('click', () => {
      zoom = 1.0;
      updateZoom();
    });

    function updateZoom() {
      canvas.style.transform = `scale(${zoom})`;
      document.getElementById('zoomLevel').textContent = `${Math.round(zoom * 100)}%`;
    }

    function calculateArea() {
      if (points.length < 3) return 0;
      let a = 0;
      for (let i = 0; i < points.length; i++) {
        let j = (i + 1) % points.length;
        a += points[i][0] * points[j][1];
        a -= points[j][0] * points[i][1];
      }
      return Math.abs(a) / 2;
    }

    function updateInfo() {
      const area = calculateArea();
      document.getElementById('polyInfo').innerHTML = `
        Image: <strong>${imageList[currentIdx].id}</strong><br>
        Vertices: ${points.length}<br>
        Normalized Area: ${area.toFixed(5)}<br>
        Status: ${isClosed ? '<span style="color:#6ee7b7">Closed & Ready</span>' : 'Delineating'}
      `;
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Grid
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 70) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      if (points.length === 0) return;

      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(points[0][0] * canvas.width, points[0][1] * canvas.height);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0] * canvas.width, points[i][1] * canvas.height);
      }
      if (isClosed) {
        ctx.closePath();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
        ctx.fill();
      }
      ctx.stroke();

      for (let i = 0; i < points.length; i++) {
        ctx.fillStyle = (i === 0) ? '#f59e0b' : '#38bdf8';
        ctx.beginPath();
        ctx.arc(points[i][0] * canvas.width, points[i][1] * canvas.height, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    document.getElementById('btnExport').addEventListener('click', () => {
      if (!isClosed || points.length < 3) {
        alert("Please complete the polygon with >= 3 vertices before saving.");
        return;
      }
      const classId = document.getElementById('classSelect').value;
      const flat = points.map(p => `${p[0].toFixed(6)} ${p[1].toFixed(6)}`).join(' ');
      const yoloLine = `${classId} ${flat}`;
      prompt("YOLO Segmentation Polygon String for " + imageList[currentIdx].id + ":", yoloLine);
    });

    selectImage(0);
  </script>
</body>
</html>
